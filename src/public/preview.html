<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>พรีวิวหน้าเวที — Live Stage</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg: #0b0b0c; --surface: #161413; --surface-2: #1d1a19; --line: #2a2623; --text: #f4f1ec; --muted: #a8a29a; --accent: #e8453c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 'Thai LoChula', 'IBM Plex Sans Thai', 'Leelawadee UI', 'Thonburi', system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; }
  .screen { flex: 1; min-height: 0; display: grid; place-items: center; background: #000; position: relative; }
  .screen iframe { height: 100%; max-width: 100%; aspect-ratio: 9 / 16; border: 0; display: block; }
  .live { position: absolute; top: 8px; left: 8px; padding: 2px 9px; border-radius: 999px; background: rgba(11,11,12,.85); font-size: 11px; color: #4fc483; font-weight: 600; }
  .bar { flex: none; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border-top: 1px solid var(--line); }
  .row { display: flex; gap: 6px; }
  input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  button { height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer; }
  button:hover { border-color: #4a443f; }
  button:focus-visible, input:focus-visible { outline: 2px solid #ffd166; outline-offset: 1px; }
  .send { background: var(--accent); border: 0; color: #fff; font-weight: 600; padding: 0 12px; height: 36px; }
  .quick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: 6px; }
  .quick button { font-size: 15px; }
  .pin { padding: 0 9px; font-size: 12px; font-weight: 600; }
  .pin[aria-pressed=true] { background: #2a1c1a; color: #ff8a80; border-color: #3d2a26; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 6px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; opacity: 0; transition: .2s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
  <div class="screen">
    <iframe id="frame" src="stage.html?silent&desktop" title="พรีวิวหน้าเวที (ปิดเสียง)" tabindex="-1"></iframe>
    <span class="live">● สด · ปิดเสียง</span>
  </div>
  <div class="bar">
    <div class="row">
      <label for="msg" style="position:absolute;left:-9999px">คอมเมนต์ทดสอบ</label>
      <input id="msg" type="text" placeholder="พิมพ์คอมเมนต์ทดสอบ…" maxlength="100">
      <button class="send" id="send" type="button">ส่ง</button>
    </div>
    <div class="quick">
      <button type="button" data-t="join" aria-label="คนดูเข้ามา" title="คนดูเข้ามา">👋</button>
      <button type="button" data-t="like" aria-label="กดหัวใจ" title="กดหัวใจ">❤</button>
      <button type="button" data-t="follow" aria-label="กดติดตาม" title="กดติดตาม">➕</button>
      <button type="button" data-t="gift" aria-label="ส่งของขวัญสุ่ม" title="ส่งของขวัญสุ่ม">🎁</button>
      <button type="button" data-t="game" aria-label="เริ่มเกมทดสอบ" title="เริ่มเกมทดสอบ">🎮</button>
      <button type="button" class="pin" id="pin" aria-pressed="false" hidden title="ให้หน้าต่างนี้อยู่บนสุดเสมอ">📌 บนสุด</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const socket = io();
  const desk = window.liveStage || null;
  const FAKE = ['น้องเมย์ 🌸', 'พี่ต้น', 'ปลาทู', 'ก้อย_99', 'มะม่วง', 'ฟ้าใส', 'แพรวา', 'โอ๊ตโอ๊ต', 'จูน', 'ตังเม', 'ใบเตย', 'กาแฟเย็น'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  let config = null;
  socket.on('snapshot', (s) => (config = s.config));
  socket.on('config', (c) => (config = c));
  let tt = 0;
  const toast = (t) => {
    $('toast').textContent = t;
    $('toast').classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(() => $('toast').classList.remove('on'), 1600);
  };
  const send = () => {
    const text = $('msg').value.trim();
    if (!text) return;
    socket.emit('test:chat', { name: pick(FAKE), text });
    $('msg').value = '';
  };
  $('send').onclick = send;
  $('msg').addEventListener('keydown', (e) => e.key === 'Enter' && send());
  document.querySelector('.quick').addEventListener('click', (e) => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    const t = b.dataset.t;
    const name = pick(FAKE);
    if (t === 'gift') {
      const gifts = config?.themes?.[config.theme]?.t?.gifts || [];
      socket.emit('test:gift', { name, gift: gifts.length ? pick(gifts).name : '', count: 1 });
    } else if (t === 'game') socket.emit('game:autoNow', null, (r) => toast(r?.ok ? 'อีก 5 วินาทีเกมเริ่ม' : r?.error || 'เริ่มเกมไม่ได้'));
    else socket.emit('test:' + t, { name });
  });
  // ปักหมุดบนสุด (เฉพาะในโปรแกรม)
  if (desk?.setPreviewPin) {
    const pin = $('pin');
    pin.hidden = false;
    const show = (on) => pin.setAttribute('aria-pressed', on ? 'true' : 'false');
    show(desk.getPreviewPin());
    pin.onclick = () => {
      const on = pin.getAttribute('aria-pressed') !== 'true';
      desk.setPreviewPin(on);
      show(on);
      toast(on ? 'อยู่บนสุดแล้ว' : 'เลิกอยู่บนสุด');
    };
  }
})();
</script>
</body>
</html>
